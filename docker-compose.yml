name: xibo

# Somente estas variaveis entram nos containers, nunca DHCP ou Wi-Fi.
x-cms-environment: &cms-environment
    MYSQL_PASSWORD: ${XIBO_DB_PASSWORD:?Preencha XIBO_DB_PASSWORD no .env}
    USERNAME: ${XIBO_ADMIN_USERNAME:-}
    PASSWORD: ${XIBO_ADMIN_PASSWORD:-}
    CMS_SERVER_NAME: ${XIBO_SERVER_NAME:-localhost}
    CMS_USAGE_REPORT: ${XIBO_USAGE_REPORT:-false}

services:
    cms-db:
        image: mysql:8.4
        volumes:
            - "./shared/db:/var/lib/mysql:Z"
        environment:
            <<: *cms-environment
            MYSQL_DATABASE: cms
            MYSQL_USER: cms
            MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        mem_limit: 1g
        restart: always
    cms-xmr:
        image: ghcr.io/xibosignage/xibo-xmr:1.3
        ports:
            - "9505:9505"
        restart: always
        mem_limit: 256m
        environment: *cms-environment
    cms-web:
        image: ghcr.io/xibosignage/xibo-cms:release-4.5.3
        volumes:
            - "./shared/cms/custom:/var/www/cms/custom:Z"
            - "./shared/backup:/var/www/backup:Z"
            - "./shared/cms/library:/var/www/cms/library:Z"
            - "./shared/cms/web/userscripts:/var/www/cms/web/userscripts:Z"
            - "./shared/cms/ca-certs:/var/www/cms/ca-certs:Z"
        restart: always
        environment:
            <<: *cms-environment
            MYSQL_HOST: cms-db
            XMR_HOST: cms-xmr
            CMS_USE_MEMCACHED: "true"
            MEMCACHED_HOST: cms-memcached
        ports:
            - "8080:80"
        mem_limit: 1g
    cms-memcached:
        image: memcached:alpine
        command: memcached -m 15
        restart: always
        mem_limit: 100M
    cms-quickchart:
      image: ianw/quickchart
      restart: always
